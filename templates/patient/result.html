<!DOCTYPE html>
<html lang="en">
<head>
    <title>Prediction Result - DiaCare</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --fg-primary: #0f172a;
            --fg-secondary: #475569;
            --fg-muted: #94a3b8;
            --accent-primary: #0d9488;
            --accent-secondary: #14b8a6;
            --accent-glow: rgba(13, 148, 136, 0.15);
            --border-color: rgba(226, 232, 240, 1);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(13, 148, 136, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--fg-primary) !important;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--fg-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--bg-primary);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 1rem 4rem;
        }

        /* Result Card */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            animation: cardEntry 0.6s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardEntry {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dynamic Header Color */
        .card-header-result {
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        /* Conditional Colors based on result */
        .result-positive {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.02));
            border-bottom: 1px solid rgba(239, 68, 68, 0.2);
        }

        .result-negative {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.02));
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
        }

        .result-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .result-positive .result-icon {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.05);
        }

        .result-negative .result-icon {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            box-shadow: 0 0 0 8px rgba(16, 185, 129, 0.05);
        }

        .result-label {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .result-positive .result-label { color: var(--danger-color); }
        .result-negative .result-label { color: var(--success-color); }

        .result-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .result-positive .result-text { color: var(--danger-color); }
        .result-negative .result-text { color: var(--success-color); }

        /* Card Body */
        .card-body-result {
            padding: 2rem;
        }

        /* Probability Section */
        .prob-section {
            margin-bottom: 2rem;
        }

        .prob-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .progress {
            height: 12px;
            background: var(--bg-primary);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }

        /* Recommendation Box */
        .recommendation-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .rec-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--fg-primary);
        }

        .rec-text {
            color: var(--fg-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn-action {
            flex: 1;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--accent-primary), #0891b2);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
            color: white;
        }

        .btn-secondary-custom {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--fg-secondary);
        }

        .btn-secondary-custom:hover {
            border-color: var(--fg-muted);
            color: var(--fg-primary);
        }

        @media (max-width: 576px) {
            .result-text {
                font-size: 2rem;
            }
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-pattern"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">
                <span class="brand-icon">
                    <i data-lucide="activity" style="width: 24px; height: 24px; color: white;"></i>
                </span>
                DiaCare
            </a>
            
            <div class="navbar-right">
                <a href="{{ url_for('patient_dashboard') }}" class="btn-back">
                    <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
                    Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="result-card">
            
            <!-- Dynamic Header -->
            <div class="card-header-result {% if result == 'Diabetic' %}result-positive{% else %}result-negative{% endif %}">
                <div class="result-icon">
                    {% if result == "Diabetic" %}
                        <i data-lucide="alert-triangle" style="width: 36px; height: 36px;"></i>
                    {% else %}
                        <i data-lucide="shield-check" style="width: 36px; height: 36px;"></i>
                    {% endif %}
                </div>
                <div class="result-label">Prediction Result</div>
                <h1 class="result-text">{{ result }}</h1>
            </div>

            <!-- Body -->
            <div class="card-body-result">
                
                

                <!-- Recommendation -->
                <div class="recommendation-box">
                    <div class="rec-header">
                        <i data-lucide="brain" style="width: 20px; height: 20px; color: var(--accent-primary);"></i>
                        AI Health Recommendation
                    </div>
                    <div class="rec-text">
                        {{ recommendation }}
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <a href="{{ url_for('prediction_page') }}" class="btn-action btn-primary-custom">
                        <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i>
                        Predict Again
                    </a>
                    <a href="{{ url_for('patient_dashboard') }}" class="btn-action btn-secondary-custom">
                        Dashboard
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
