<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book Appointment - DiaCare</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --fg-primary: #0f172a;
            --fg-secondary: #475569;
            --fg-muted: #94a3b8;
            --accent-primary: #0d9488;
            --accent-secondary: #14b8a6;
            --accent-glow: rgba(13, 148, 136, 0.15);
            --border-color: rgba(226, 232, 240, 1);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background Pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(13, 148, 136, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--fg-primary) !important;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--fg-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--bg-primary);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 1rem 4rem;
        }

        /* Booking Card */
        .booking-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            animation: cardEntry 0.6s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .booking-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), #0891b2);
        }

        /* Card Header */
        .card-header-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.1), rgba(6, 182, 212, 0.05));
            border: 1px solid rgba(13, 148, 136, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: var(--accent-primary);
        }

        .booking-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .doctor-context {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(59, 130, 246, 0.1);
            color: #2563eb;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--fg-primary);
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--fg-muted);
            pointer-events: none;
            z-index: 5;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 3rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--fg-primary);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        /* Textarea specific */
        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .textarea-icon {
            position: absolute;
            left: 1rem;
            top: 1rem;
            transform: none;
            pointer-events: none;
            z-index: 5;
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), #0891b2);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        /* Footer Links */
        .booking-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .booking-footer a {
            color: var(--fg-secondary);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .booking-footer a:hover {
            color: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 576px) {
            .booking-card {
                padding: 1.5rem;
            }
            .booking-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-pattern"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">
                <span class="brand-icon">
                    <i data-lucide="activity" style="width: 24px; height: 24px; color: white;"></i>
                </span>
                DiaCare
            </a>
            
            <div class="navbar-right">
                <a href="{{ url_for('doctors_list') }}" class="btn-back">
                    <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
                    Back
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="booking-card">
            
            <!-- Header -->
            <div class="card-header-section">
                <div class="header-icon">
                    <i data-lucide="calendar-plus"></i>
                </div>
                <h1 class="booking-title">Book Appointment</h1>
                <div class="doctor-context">
                    <i data-lucide="user-check" style="width: 14px; height: 14px;"></i>
                    With Dr. {{ doctor.name }}
                </div>
            </div>

            <!-- Form -->
            <form method="POST">
                
                <!-- Date Input -->
                <div class="form-group">
                    <label class="form-label">Preferred Date</label>
                    <div class="input-group">
                        <input type="date" name="date" class="form-control" required>
                        <span class="input-icon"><i data-lucide="calendar"></i></span>
                    </div>
                </div>

                <!-- Symptoms Input -->
                <div class="form-group">
                    <label class="form-label">Symptoms / Reason for Visit</label>
                    <div class="input-group">
                        <span class="input-icon textarea-icon"><i data-lucide="clipboard-list"></i></span>
                        <textarea name="symptoms" class="form-control" style="padding-left: 3rem;" placeholder="Briefly describe your symptoms (optional)"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i data-lucide="check-circle" style="width: 20px; height: 20px;"></i>
                    Confirm Appointment
                </button>
            </form>

            <!-- Footer -->
            <div class="booking-footer">
                <a href="{{ url_for('doctors_list') }}">
                    <i data-lucide="list" style="width: 16px; height: 16px;"></i>
                    Choose another doctor
                </a>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Set min date to today for the date picker
        const dateInput = document.querySelector('input[type="date"]');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
    </script>
</body>
</html>
