<!DOCTYPE html>
<html lang="en">
<head>
    <title>Diabetes Prediction - DiaCare</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --fg-primary: #0f172a;
            --fg-secondary: #475569;
            --fg-muted: #94a3b8;
            --accent-primary: #0d9488;
            --accent-secondary: #14b8a6;
            --accent-glow: rgba(13, 148, 136, 0.15);
            --border-color: rgba(226, 232, 240, 1);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(13, 148, 136, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--fg-primary) !important;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--fg-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--bg-primary);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 1rem 4rem;
        }

        /* Prediction Card */
        .prediction-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 800px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            animation: cardEntry 0.6s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prediction-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), #0891b2);
        }

        /* Header */
        .card-header-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: #ef4444;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            color: var(--fg-secondary);
            font-size: 0.95rem;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem 2rem;
        }

        /* Form Group */
        .form-group {
            position: relative;
            margin-bottom: 0; /* Handled by grid gap */
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--fg-secondary);
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--fg-muted);
            pointer-events: none;
            z-index: 5;
            transition: color 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--fg-primary);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .form-control:focus + .input-icon {
            color: var(--accent-primary);
        }

        .form-control::placeholder {
            color: var(--fg-muted);
        }

        /* Button Container */
        .button-container {
            grid-column: 1 / -1; /* Span full width */
            margin-top: 1.5rem;
        }

        .btn-predict {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), #0891b2);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        /* Footer */
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .form-footer a {
            color: var(--fg-secondary);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-footer a:hover {
            color: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }
            .prediction-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-pattern"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">
                <span class="brand-icon">
                    <i data-lucide="activity" style="width: 24px; height: 24px; color: white;"></i>
                </span>
                DiaCare
            </a>
            
            <div class="navbar-right">
                <a href="{{ url_for('patient_dashboard') }}" class="btn-back">
                    <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
                    Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="prediction-card">
            
            <!-- Header -->
            <div class="card-header-section">
                <div class="header-icon">
                    <i data-lucide="activity"></i>
                </div>
                <h1 class="card-title">Diabetes Risk Prediction</h1>
                <p class="card-subtitle">Enter the patient's health metrics below to assess risk</p>
            </div>

            <!-- Form -->
            <form method="POST" action="{{ url_for('predict') }}">
                <div class="form-grid">
                    
                    <!-- Pregnancies -->
                    <div class="form-group">
                        <label class="form-label">Pregnancies</label>
                        <div class="input-wrapper">
                            <input type="number" name="pregnancies" class="form-control" placeholder="0" required>
                            <span class="input-icon"><i data-lucide="baby"></i></span>
                        </div>
                    </div>

                    <!-- Glucose -->
                    <div class="form-group">
                        <label class="form-label">Glucose Level (mg/dL)</label>
                        <div class="input-wrapper">
                            <input type="number" step="any" name="glucose" class="form-control" placeholder="e.g. 120" required>
                            <span class="input-icon"><i data-lucide="droplet"></i></span>
                        </div>
                    </div>

                    <!-- Blood Pressure -->
                    <div class="form-group">
                        <label class="form-label">Blood Pressure (mm Hg)</label>
                        <div class="input-wrapper">
                            <input type="number" step="any" name="blood_pressure" class="form-control" placeholder="e.g. 80" required>
                            <span class="input-icon"><i data-lucide="heart-pulse"></i></span>
                        </div>
                    </div>

                    <!-- Skin Thickness -->
                    <div class="form-group">
                        <label class="form-label">Skin Thickness (mm)</label>
                        <div class="input-wrapper">
                            <input type="number" step="any" name="skin_thickness" class="form-control" placeholder="e.g. 20" required>
                            <span class="input-icon"><i data-lucide="ruler"></i></span>
                        </div>
                    </div>

                    <!-- Insulin -->
                    <div class="form-group">
                        <label class="form-label">Insulin (mu U/ml)</label>
                        <div class="input-wrapper">
                            <input type="number" step="any" name="insulin" class="form-control" placeholder="e.g. 79" required>
                            <span class="input-icon"><i data-lucide="syringe"></i></span>
                        </div>
                    </div>

                    <!-- BMI -->
                    <div class="form-group">
                        <label class="form-label">BMI (Weight in kg/(Height in m)^2)</label>
                        <div class="input-wrapper">
                            <input type="number" step="any" name="bmi" class="form-control" placeholder="e.g. 23.5" required>
                            <span class="input-icon"><i data-lucide="scale"></i></span>
                        </div>
                    </div>

                    <!-- DPF -->
                    <div class="form-group">
                        <label class="form-label">Diabetes Pedigree Function</label>
                        <div class="input-wrapper">
                            <input type="number" step="any" name="dpf" class="form-control" placeholder="e.g. 0.5" required>
                            <span class="input-icon"><i data-lucide="git-branch"></i></span>
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="form-group">
                        <label class="form-label">Age (Years)</label>
                        <div class="input-wrapper">
                            <input type="number" name="age" class="form-control" placeholder="e.g. 33" value="{{ age|default('') }}" required>
                            <span class="input-icon"><i data-lucide="calendar"></i></span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="button-container">
                        <button type="submit" class="btn-predict">
                            <i data-lucide="scan-search" style="width: 20px; height: 20px;"></i>
                            Analyze & Predict
                        </button>
                    </div>

                </div>
            </form>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
